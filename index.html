<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estilo Profesional MBTI · Tenkai Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   TENKAI · Estilo Profesional MBTI
   Sistema de diseño: Manual de Marca 2026 (Zona 2 · proceso activo)
   ══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --i:#3b35a8;--deep:#2d2894;--mag:#8b3a8f;--coral:#d4522a;
  --bg:#f0eff5;--ink:#1a1a2e;--sub:#555566;--muted:#888899;
  --border:#e2e0ea;--cream:#ece9f4;--white:#ffffff;
  --grad:linear-gradient(135deg,#3b35a8 0%,#8b3a8f 50%,#d4522a 100%);
  --grad-h:linear-gradient(90deg,#3b35a8 0%,#d4522a 100%);
  --f:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--f);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
button{font-family:var(--f)}
.hidden{display:none!important}

/* ── HEADER (blanco, sticky) ───────────────────────────── */
.hdr{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border)}
.hdr-in{max-width:900px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr-left img{width:42px;height:42px;border-radius:9px;display:block}
.hdr-brand{font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1}
.hdr-sub{font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.prog-wrap{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;color:var(--muted)}
.prog-bar{width:110px;height:5px;border-radius:3px;background:var(--border);overflow:hidden}
.prog-fill{height:100%;background:var(--i);border-radius:3px;transition:width .4s ease}

/* ── PÁGINAS Y HERO ────────────────────────────────────── */
.page{display:none}
.page.on{display:block}
.wrap{max-width:780px;margin:0 auto;padding:0 24px}
.hero{background:var(--i);color:#fff;padding:46px 0 40px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08) 0%,transparent 66%);pointer-events:none}
.hero-ink{background:var(--ink)}
.hero .wrap{position:relative;z-index:2}
.sup{font-size:9.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--i)}
.hero .sup{color:rgba(255,255,255,.5);margin-bottom:12px}
.hero-thin{display:block;font-size:22px;font-weight:300;color:rgba(255,255,255,.78);letter-spacing:-.2px;line-height:1.2}
.hero-bold{display:block;font-size:clamp(28px,5.2vw,38px);font-weight:800;letter-spacing:-.5px;color:#fff;line-height:1.1;margin-top:2px}
.hero-bold.grad-text{max-width:100%;word-break:break-word}
.grad-text{background:var(--grad-h);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sec{padding:34px 0 56px}
/* ── TEXTOS Y FORMULARIOS ──────────────────────────────── */
.sec-title{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.15;color:var(--ink);margin:4px 0 8px}
.sec-desc{font-size:14.5px;line-height:1.7;color:var(--sub);max-width:640px;margin-bottom:26px}
.lbl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.q{font-size:16px;font-weight:700;letter-spacing:-.2px;color:var(--ink);margin-bottom:6px}
.help{font-size:13px;color:var(--sub);line-height:1.65;margin-bottom:12px;max-width:620px}
.intro-p{font-size:15px;line-height:1.8;color:var(--sub);margin-bottom:16px;max-width:640px}
.intro-p strong{color:var(--ink)}
input[type=text],input[type=email],select,textarea{font-family:var(--f);width:100%;padding:11px 15px;border:1.5px solid var(--border);border-radius:8px;font-size:14.5px;color:var(--ink);background:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--i);box-shadow:0 0 0 3px rgba(59,53,168,.1)}
textarea{resize:vertical;line-height:1.6;min-height:84px}
.field{margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.count{font-size:10.5px;color:var(--muted);text-align:right;margin-top:4px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px 24px;box-shadow:0 2px 10px rgba(59,53,168,.07);margin-bottom:18px}
.card-accent{background:#fff;border:1px solid var(--border);border-left:4px solid var(--coral);border-radius:0 14px 14px 0;padding:22px 24px;box-shadow:0 2px 10px rgba(59,53,168,.07);margin-bottom:22px}
.hint-bar{display:flex;gap:10px;align-items:flex-start;background:var(--cream);border-radius:12px;padding:14px 18px;font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:24px}
.note{font-size:12px;color:var(--muted);line-height:1.65}

/* ── BOTONES ───────────────────────────────────────────── */
.btn-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 26px;background:var(--i);color:#fff;border:none;border-radius:24px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--deep);transform:translateY(-1px)}
.btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;transform:none}
.btn-outline{display:inline-flex;align-items:center;gap:8px;padding:11px 24px;background:transparent;color:var(--i);border:2px solid var(--i);border-radius:24px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-outline:hover{background:var(--i);color:#fff}
.btn-outline:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink)}

.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--i);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
/* ── FOOTER (gradiente, base Zona 2) ───────────────────── */
.tk-footer{background:var(--grad);padding:38px 24px 30px;text-align:center}
.tk-footer-in{max-width:700px;margin:0 auto}
.tk-footer img{height:44px;width:auto;display:block;margin:0 auto 10px}
.tk-tag{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:18px}
.tk-links{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px}
.tk-links a{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.78);text-decoration:none;white-space:nowrap}
.tk-links a:hover{color:#fff}
.tk-copy{font-size:9.5px;letter-spacing:.14em;color:rgba(255,255,255,.4);margin-top:18px}

/* ── TOAST ─────────────────────────────────────────────── */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══════════════════════════════════════════════════════════════
   ESTILO PROFESIONAL MBTI · estilos propios (Manual de Marca 2026 · Zona 2)
   Evaluación: header indigo sólido, secciones blancas, resultado en ink.
   ══════════════════════════════════════════════════════════════ */
.chips-info{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
.info-pill{background:#fff;border:1px solid var(--border);border-radius:24px;padding:8px 16px;font-size:12.5px;font-weight:600;color:var(--sub)}
.info-pill strong{color:var(--i);font-weight:800}
.resume{background:#fff;border:1.5px solid var(--i);border-radius:14px;padding:18px 22px;margin-bottom:22px}
.resume h3{font-size:16px;font-weight:800;letter-spacing:-.2px;margin-bottom:4px}
.resume p{font-size:13.5px;color:var(--sub);line-height:1.6;margin-bottom:12px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 24px}
.step3{background:#fff;border:1px solid var(--border);border-top:3px solid var(--i);border-radius:12px;padding:14px 14px 16px}
.step3-n{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--i);margin-bottom:5px}
.step3-t{font-size:13px;font-weight:700;line-height:1.4;color:var(--ink)}

/* ── Pregunta ─────────────────────────────────────────── */
.q-scr{max-width:720px;margin:0 auto;padding:30px 22px 60px;min-height:calc(100vh - 62px)}
.q-eye{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.q-eye-l{font-size:9.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--i)}
.q-eye-r{font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.q-eye-l{min-width:0}
.q-card{position:relative;background:#fff;border:1px solid var(--border);border-radius:18px;padding:34px 30px 30px;box-shadow:0 2px 10px rgba(59,53,168,.07);overflow:hidden;margin-bottom:18px;animation:qin .3s ease both}
@keyframes qin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.q-ghost{position:absolute;right:18px;top:-6px;font-size:120px;font-weight:900;color:#e9e7f3;line-height:1;letter-spacing:-6px;pointer-events:none;user-select:none}
.q-txt{position:relative;z-index:2;font-size:clamp(19px,3.6vw,23px);font-weight:700;line-height:1.45;letter-spacing:-.3px;color:var(--ink);max-width:560px;margin-bottom:8px}
.q-ask{position:relative;z-index:2;font-size:12.5px;color:var(--muted);margin-bottom:22px}
.fmt-tag{position:relative;z-index:2;display:inline-block;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--i);background:var(--cream);border-radius:10px;padding:3px 10px;margin-bottom:14px}
.resp{position:relative;z-index:2}
.letter{flex:0 0 28px;width:28px;height:28px;border-radius:50%;background:var(--cream);color:var(--i);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;transition:all .15s}

/* Formato · Duelo (dos tarjetas lado a lado) */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dcard{display:flex;flex-direction:column;gap:12px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:16px 18px 20px;cursor:pointer;transition:all .15s;color:var(--ink);font-size:15px;font-weight:700;line-height:1.45;letter-spacing:-.15px}
.dcard:hover{border-color:var(--i);transform:translateY(-2px);box-shadow:0 6px 18px rgba(59,53,168,.1)}
.dcard.on{border-color:var(--i);background:var(--i);color:#fff}
.dcard.on .letter,.srow.on .letter{background:#fff;color:var(--i)}

/* Formato · Dos caminos (filas completas) */
.stk{display:flex;flex-direction:column;gap:10px}
.srow{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:15px 18px;cursor:pointer;transition:all .15s;color:var(--ink);font-size:15px;font-weight:600;line-height:1.4}
.srow:hover{border-color:var(--i)}
.srow.on{background:var(--i);border-color:var(--i);color:#fff}

/* Formato · Palabras (dos píldoras) */
.chipsr{display:flex;gap:14px;flex-wrap:wrap}
.wchip{flex:1 1 170px;padding:24px 16px;background:#fff;border:1.5px solid var(--border);border-radius:44px;font-size:clamp(18px,3.4vw,22px);font-weight:800;letter-spacing:-.3px;text-align:center;color:var(--ink);cursor:pointer;transition:all .15s}
.wchip:hover{border-color:var(--i);color:var(--i)}
.wchip.on{background:var(--i);border-color:var(--i);color:#fff}

/* Formato · Cara a cara (barras apiladas) */
.vs{display:flex;flex-direction:column;align-items:stretch}
.vbar{padding:22px 20px;background:#fff;border:1.5px solid var(--border);border-radius:14px;font-size:clamp(19px,3.6vw,24px);font-weight:800;letter-spacing:-.4px;text-align:center;color:var(--ink);cursor:pointer;transition:all .15s}
.vbar:hover{border-color:var(--i);color:var(--i)}
.vbar.on{background:var(--i);border-color:var(--i);color:#fff}
.vmid{align-self:center;margin:-11px 0;position:relative;z-index:3;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;border:3px solid #fff;font-size:10px;font-weight:800;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;text-transform:uppercase}

/* Formato · Tarjeta (se da vuelta y muestra el significado) */
.fc{perspective:1000px;margin-bottom:16px}
.fc-in{position:relative;height:196px;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;cursor:pointer}
.fc.flipped .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:14px;padding:18px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.fc-front{background:var(--ink);color:#fff}
.fc-back{background:var(--i);color:#fff;transform:rotateY(180deg);align-items:stretch;text-align:left;gap:6px}
.fc-eye{font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:10px}
.fc-back .fc-eye{margin-bottom:2px;text-align:center}
.fc-words{font-size:clamp(20px,4vw,26px);font-weight:800;letter-spacing:-.4px;line-height:1.25}
.fc-words em{font-style:normal;font-weight:300;color:rgba(255,255,255,.55);margin:0 8px}
.fc-hint{font-size:11px;color:rgba(255,255,255,.5);margin-top:12px}
.fc-w{font-size:13.5px;font-weight:800;margin-top:2px}
.fc-d{font-size:12px;line-height:1.5;color:rgba(255,255,255,.82)}
.fc-sep{height:1px;background:rgba(255,255,255,.2);margin:4px 0}

/* Formato · Balanza (deslizar entre dos polos) */
.bal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.bcard{position:relative;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:14px 14px 16px;font-size:14px;font-weight:700;line-height:1.4;color:var(--ink);transition:all .18s;display:flex;flex-direction:column;gap:10px;opacity:.9}
.bcard.lean{border-color:var(--i);background:var(--cream)}
.bcard.lean3{background:var(--i);border-color:var(--i);color:#fff}
.bcard.lean3 .letter{background:#fff;color:var(--i)}
.bcard.dim{opacity:.5}
.bsl{margin-top:20px}
.sl-lab{text-align:center;font-size:13.5px;font-weight:700;color:var(--sub);min-height:22px;margin-bottom:12px}
.sl-lab.on{color:var(--i)}
.qslider{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;outline:none;border:none;padding:0;box-shadow:none;background:var(--border);cursor:pointer}
.qslider::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--i);cursor:pointer;border:4px solid #fff;box-shadow:0 2px 10px rgba(59,53,168,.35)}
.qslider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--i);cursor:pointer;border:4px solid #fff}
.qslider.off::-webkit-slider-thumb{background:#fff;border:4px solid var(--i)}
.qslider.off::-moz-range-thumb{background:#fff;border:4px solid var(--i)}
.bticks{display:flex;justify-content:space-between;padding:0 11px;margin-top:10px}
.bticks i{display:block;width:2px;height:7px;background:#cfcce0;border-radius:1px}
.bticks i.c{height:11px;background:var(--muted)}

/* Formato · Escenario */
.scn{position:relative;z-index:2;background:var(--ink);color:#fff;border-radius:14px;padding:18px 22px 20px;margin-bottom:20px}
.scn-eye{font-size:9px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:8px}
.scn-t{font-size:15.5px;line-height:1.6;font-weight:500;color:rgba(255,255,255,.92)}

.q-nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.q-hint{font-size:12px;color:var(--muted)}

/* ── Apertura de capítulo ─────────────────────────────── */
.mid{max-width:580px;margin:0 auto;padding:56px 22px;text-align:center}
.mid-badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--i);background:var(--cream);border-radius:14px;padding:5px 14px;margin-bottom:24px}
.mid-ring{--p:0;width:96px;height:96px;border-radius:50%;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:var(--i);letter-spacing:-.5px;background:conic-gradient(var(--i) calc(var(--p)*1%),var(--cream) 0);position:relative}
.mid-ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg)}
.mid-ring span{position:relative}
.mid h2{font-size:27px;font-weight:800;letter-spacing:-.5px;line-height:1.2;margin-bottom:10px}
.mid p{font-size:14.5px;line-height:1.75;color:var(--sub);margin-bottom:22px}
.mid-tip{background:#fff;border:1px solid var(--border);border-left:4px solid var(--coral);border-radius:0 12px 12px 0;padding:14px 18px;font-size:13.5px;line-height:1.65;color:var(--sub);text-align:left;margin-bottom:26px}
.mid-tip strong{color:var(--ink)}
.mid-stats{display:flex;justify-content:center;gap:0;margin-bottom:28px}
.mid-stat{padding:0 24px;text-align:center}
.mid-stat+.mid-stat{border-left:1px solid var(--border)}
.mid-stat b{display:block;font-size:28px;font-weight:900;letter-spacing:-1px;color:var(--ink);line-height:1.1}
.mid-stat span{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ── Envío ────────────────────────────────────────────── */
.send-scr{max-width:560px;margin:0 auto;padding:70px 22px;text-align:center}
.send-scr h2{font-size:24px;font-weight:800;letter-spacing:-.4px;margin:18px 0 8px}
.send-scr p{font-size:14.5px;line-height:1.75;color:var(--sub);margin-bottom:20px}
.big-spin{width:46px;height:46px;border:4px solid var(--cream);border-top-color:var(--i);border-radius:50%;animation:sp .9s linear infinite;margin:0 auto}

/* ── Resultado (pantallazo, fondo ink) ────────────────── */
.res-hero{background:var(--ink);color:#fff;padding:44px 0 38px;position:relative;overflow:hidden}
.res-hero::after{content:"";position:absolute;right:-70px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(59,53,168,.4) 0%,transparent 66%)}
.res-hero .wrap{position:relative;z-index:2}
.res-ok{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:20px;padding:6px 14px;font-size:11.5px;font-weight:700;letter-spacing:.04em;margin-bottom:16px}
.res-ok svg{width:14px;height:14px}
.res-t{font-size:clamp(26px,5vw,36px);font-weight:800;letter-spacing:-.6px;line-height:1.12;margin-bottom:8px}
.res-s{font-size:14px;line-height:1.7;color:rgba(255,255,255,.7);max-width:520px}
.type-card{background:var(--ink);border-radius:18px;padding:34px 26px 30px;text-align:center;margin-bottom:26px;position:relative;overflow:hidden}
.type-card::after{content:"";position:absolute;left:50%;bottom:-120px;width:340px;height:240px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(212,82,42,.22) 0%,transparent 68%);pointer-events:none}
.type-eye{font-size:9.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:14px;position:relative;z-index:2}
.type-tiles{display:flex;justify-content:center;gap:clamp(8px,2.4vw,14px);position:relative;z-index:2}
.tile{flex:0 0 auto;width:clamp(62px,19vw,92px);text-align:center}
.tile-l{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:18px;background:var(--i);color:#fff;font-size:clamp(30px,9vw,46px);font-weight:900;letter-spacing:-1px;box-shadow:0 8px 22px rgba(0,0,0,.28)}
.tile.g .tile-l{background:var(--grad)}
.tile-n{margin-top:9px;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.62);line-height:1.3}
.type-desc{font-size:14.5px;line-height:1.75;color:rgba(255,255,255,.78);max-width:470px;margin:18px auto 0;position:relative;z-index:2}
.dim{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 20px 18px;margin-bottom:10px;box-shadow:0 2px 10px rgba(59,53,168,.06)}
.dim-t{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--i);margin-bottom:12px}
.dim-track{position:relative;height:8px;border-radius:4px;background:var(--border);margin:0 11px}
.dim-fill{position:absolute;top:0;bottom:0;background:var(--i);border-radius:4px}
.dim-mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:#cfcce0;transform:translateX(-1px)}
.dim-dot{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--i);border:4px solid #fff;box-shadow:0 2px 8px rgba(59,53,168,.35);transform:translate(-50%,-50%)}
.dim-poles{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:12.5px;font-weight:600;color:var(--muted)}
.dim-poles .win{color:var(--ink);font-weight:800}
.traits{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:26px}
.trait{padding:9px 18px;border-radius:22px;font-size:13px;font-weight:700;color:#fff;background:var(--i)}
.trait.g{background:var(--grad-h)}
.next-box{background:var(--cream);border-radius:14px;padding:20px 24px;font-size:14px;line-height:1.75;color:var(--sub)}
.next-box strong{color:var(--ink)}
.restart2{display:flex;flex-direction:column;align-items:center;gap:14px;margin:34px 0 0;padding-top:24px;border-top:1px solid var(--border)}
.restart-confirm{max-width:480px;text-align:center;background:#fff;border:1.5px solid var(--coral);border-radius:14px;padding:18px 22px}
.restart-confirm p{font-size:13.5px;line-height:1.65;color:var(--sub);margin-bottom:14px}
.restart-confirm strong{color:var(--ink)}
.restart-confirm .actions-row{display:flex;gap:11px;flex-wrap:wrap;justify-content:center}

@media(max-width:560px){
  .q-hint{display:none}
  .q-eye-l{letter-spacing:.14em}
  .q-nav{justify-content:space-between}
  .duel,.steps3,.grid2{grid-template-columns:1fr}
  .q-card{padding:28px 20px 24px}
  .q-ghost{font-size:96px}
  .bcard{font-size:13px;padding:12px 12px 14px}
  .mid-stat{padding:0 14px}
  .fc-in{height:236px}
  .dim{padding:14px 16px 16px}
}
@media(prefers-reduced-motion:reduce){
  .q-card{animation:none}
  .fc-in{transition:none}
}

/* ── Impresión: si alguien imprime el pantallazo, sale limpio ── */
@page{size:A4 portrait;margin:14mm}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff!important}
  .hdr,.tk-footer,.toast,.restart2,.no-print{display:none!important}
  .dim,.type-card,.next-box{break-inside:avoid}
}

</style>

orden y llega a conclusiones a partir de la evidencia.","Hecho":"Preferencia por lo concreto y verificable, por lo que efectivamente ocurrió."},"SCEN":{"59":"Empezás un proyecto con entrega en una semana. El equipo recién arranca y hay mucho por definir.","60":"Estás en un evento con personas que no conocés.","61":"Tenés que hacer algo que mucha gente también hace, una tarea cotidiana.","62":"Recién conocés a alguien en un contexto laboral.","63":"Tenés que elegir entre dos formatos de capacitación.","64":"Alguien del equipo te hace un comentario positivo sobre cómo trabajaste.","65":"Tenés que decidir cómo organizar una serie de tareas importantes.","66":"Estás en un grupo de trabajo o reunión.","67":"Estás en una fiesta o reunión social con conocidos.","68":"Pensás en cómo organizar el fin de semana.","69":"Alguien te describe con una sola palabra frente a otros.","70":"Tenés varios compromisos por delante esta semana.","71":"Estás trabajando en un proyecto que importa.","72":"Tenés una tarde libre y aparece la oportunidad de charlar.","73":"Tu equipo te pregunta cómo preferís abordar algo que ya funciona.","74":"Estás leyendo un informe o artículo largo para el trabajo.","75":"Tenés que elegir con quién trabajar de forma cercana.","76":"Tenés varias tareas que hacer durante el día.","77":"Te encontrás en un ascensor con alguien que no conocés.","78":"Tenés que tomar una decisión que afecta a tu equipo."},"POLES":{"79":"¿Qué te atrae más?","80":"¿Qué te define más?","81":"¿Con cuál te identificás?","82":"¿Qué te motiva más?","83":"¿Qué preferís?","84":"¿Qué te resuena más?","85":"¿Qué te describe?","86":"¿Qué preferís?","87":"¿Qué te atrae más?","88":"¿Qué te sale naturalmente?","89":"¿Con cuál te identificás más?","90":"¿Qué preferís?","91":"¿Qué te describe mejor?","92":"¿Qué valorás más?","93":"¿Qué te atrae?"}};
var QS = D.QS, KEY = D.KEY, TYPES = D.TYPES, DIMS = D.DIMS, CHAPTERS = D.CHAPTERS, DEFS = D.DEFS, SCEN = D.SCEN, POLES = D.POLES;

/* Formato de cada pregunta: rota dentro del capítulo para que no haya dos seguidas iguales */
function fmtOf(i){
  var q = QS[i], k = i - CH_START[q.p];
  if (q.p === 1) return ['duel', 'stack', 'scale'][k % 3];
  if (q.p === 2) return ['chips', 'vs', 'flip', 'scale'][k % 4];
  if (q.p === 3) return ['scn', 'scnScale', 'scnDuel'][k % 3];
  return ['scale', 'vs', 'scale', 'chips'][k % 4];
}
function stemOf(i){
  var q = QS[i];
  if (POLES[q.id]) return POLES[q.id];
  if (q.q === '¿Cuál de estas palabras te atrae más?') return STEMS[i % STEMS.length];
  return q.q;
}

/* ── PUNTAJE (misma lógica que el test original) ───────────── */
function calc(ans){
  var c = {E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0};
  var pairs = {EI:['E','I'], SN:['S','N'], TF:['T','F'], JP:['J','P']};
  Object.keys(ans).forEach(function(id){
    var e = KEY[id]; if (!e) return;
    var pr = pairs[e[0]], poleA = e[1], poleB = pr[0] === poleA ? pr[1] : pr[0];
    c[ans[id] === 'A' ? poleA : poleB]++;
  });
  /* Empate: gana el polo de la derecha (I, N, F, P), igual que en el Gem */
  var type = (c.E > c.I ? 'E' : 'I') + (c.S > c.N ? 'S' : 'N') + (c.T > c.F ? 'T' : 'F') + (c.J > c.P ? 'J' : 'P');
  return {c:c, type:type};
}

    bar.classList.remove('hidden');
    $('progFill').style.width = Math.round(answeredCount() / TOTAL * 100) + '%';
    $('progTxt').textContent = answeredCount() + ' / ' + TOTAL;
  } else if (view === 'result') {
    bar.classList.remove('hidden'); $('progFill').style.width = '100%'; $('progTxt').textContent = 'Enviada';
  } else {
    bar.classList.add('hidden'); $('progTxt').textContent = 'Evaluación';

}

}

function letterEl(l){ return '<span class="letter">' + l + '</span>'; }
function pickHTML(f, q, ans){

  }

      '</div></div>' +
      '<div class="chipsr"><button class="wchip' + a + '" data-action="pick" data-l="A">' + A + '</button><button class="wchip' + b + '" data-action="pick" data-l="B">' + B + '</button></div>';

function scaleVal(q){
  var a = state.ans[q.id], s = state.st[q.id] || 2;
  return a === 'A' ? 3 - s : (a === 'B' ? 3 + s : 3);
}
function scaleHTML(q){
  var v = scaleVal(q), ticks = '';

  return '<div class="bal"><div class="bcard" id="bcA">' + letterEl('A') + '<span>' + esc(q.a) + '</span></div><div class="bcard" id="bcB">' + letterEl('B') + '<span>' + esc(q.b) + '</span></div></div>' +

function paintScale(v){
  var q = QS[state.q], word = isWordQ(q), sl = $('qscale'); if (!sl) return;
  var c = 50, p = v / 6 * 100, lo = Math.min(c, p), hi = Math.max(c, p);
  sl.style.background = 'linear-gradient(to right,#e2e0ea 0%,#e2e0ea ' + lo + '%,#3b35a8 ' + lo + '%,#3b35a8 ' + hi + '%,#e2e0ea ' + hi + '%,#e2e0ea 100%)';
  sl.classList.toggle('off', v === 3);
  var A = $('bcA'), B = $('bcB'), lab = $('slLab'), s = Math.abs(v - 3);
  A.className = 'bcard'; B.className = 'bcard';
  if (v === 3) {
    lab.className = 'sl-lab'; lab.textContent = 'Movelo hacia A o hacia B para responder';
    return;
  }
  var win = v < 3 ? A : B, lose = v < 3 ? B : A, name = v < 3 ? q.a : q.b, letter = v < 3 ? 'A' : 'B';
  win.classList.add(s === 3 ? 'lean3' : 'lean'); lose.classList.add('dim');

}

/* ── Resultado (pantallazo: sin números) ───────────────────── */
function resultHTML(){
  var r = calc(state.ans), type = r.type, info = TYPES[type];
  var rows = DIMS.map(function(d){
    var lc = r.c[d.l], rc = r.c[d.r], tot = lc + rc;
    var x = tot ? Math.round(rc / tot * 100) : 50;          /* 0 = todo izquierda, 100 = todo derecha */
    var winRight = rc >= lc;                                 /* empate: polo derecho */
    var fillL = Math.min(50, x), fillW = Math.abs(x - 50);
    return '<div class="dim"><div class="dim-t">' + esc(d.t) + '</div>' +
      '<div class="dim-track"><div class="dim-fill" style="left:' + fillL + '%;width:' + fillW + '%"></div><div class="dim-mid"></div><div class="dim-dot" style="left:' + x + '%"></div></div>' +
      '<div class="dim-poles"><span class="' + (winRight ? '' : 'win') + '">' + esc(d.ln) + ' (' + d.l + ')</span><span class="' + (winRight ? 'win' : '') + '">' + esc(d.rn) + ' (' + d.r + ')</span></div></div>';
  }).join('');
  var tiles = DIMS.map(function(d, i){
    var l = type.charAt(i), nm = (l === d.l) ? d.ln : d.rn;
    return '<div class="tile' + (i % 2 ? ' g' : '') + '"><div class="tile-l">' + l + '</div><div class="tile-n">' + esc(nm) + '</div></div>';
  }).join('');
  var pills = info.traits.map(function(t, i){ return '<span class="trait' + (i % 2 ? ' g' : '') + '">' + esc(t) + '</span>'; }).join('');
  return '<div><div class="res-hero"><div class="wrap">' +
    '<div class="res-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>Evaluación enviada</div>' +
    '<h1 class="res-t">Gracias, ' + esc(state.nombre.split(' ')[0]) + '. Este es tu primer pantallazo</h1>' +
    '<p class="res-s">Recibimos tus respuestas y con ellas se arma tu informe completo. Mientras tanto, este es el estilo que se perfila hoy en tu forma de trabajar.</p></div></div>' +
    '<div class="wrap"><div class="sec">' +
    '<div class="type-card"><p class="type-eye">Tu estilo profesional</p><div class="type-tiles">' + tiles + '</div><p class="type-desc">' + esc(info.d) + '</p></div>' +
    '<p class="sup" style="margin-bottom:12px">Tu perfil de un vistazo</p>' + rows +
    '<p class="sup" style="margin:26px 0 12px">Primeras pistas</p><div class="traits">' + pills + '</div>' +
    '<div class="next-box"><strong>Qué sigue.</strong> Esto es solo un adelanto. El análisis completo, con el significado de cada preferencia en tu caso, las tensiones entre ellas y lo que implican para tu carrera, se trabaja en tu próxima reunión del proceso de diseño de carrera.</div>' +
    '<div class="restart2" id="restartBox"><button class="btn-ghost" id="btnRestart" data-action="restart">Volver a iniciar</button>' +
    '<div class="restart-confirm hidden" id="restartConfirm"><p><strong>Volver a iniciar borra lo cargado en este dispositivo</strong> y te lleva al principio para hacer la evaluación de nuevo. Lo que ya enviaste no se borra.</p><div class="actions-row"><button class="btn" data-action="restartYes">Sí, empezar de cero</button><button class="btn-ghost" data-action="restartNo">Cancelar</button></div></div></div>' +
    '</div></div></div>';
}

/* ── LÓGICA DE LA EVALUACIÓN ───────────────────────────────── */
function checkStart(){
  var b = $('btnStart'); if (!b) return;
  b.disabled = !(state.nombre.trim().length > 1 && state.apellido.trim().length > 1 && validEmail(state.email));
}
function startEval(){
  state.nombre = state.nombre.trim(); state.apellido = state.apellido.trim(); state.email = state.email.trim();
  if (!state.sid) state.sid = newSid();
  if (!state.started) state.started = Date.now();
  state.q = 0; save(); show('q');
}
function curQ(){ return QS[state.q]; }
function enableNext(){ var b = $('btnNext'); if (b) b.disabled = false; var h = $('qHint'); if (h) h.textContent = ''; }

function setPick(l){
  var q = curQ(), idx = state.q;
  state.ans[q.id] = l; delete state.st[q.id]; save();
  document.querySelectorAll('#resp [data-l]').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-l') === l); });
  enableNext();
  clearTimeout(advTimer);
  advTimer = setTimeout(function(){ if (view === 'q' && state.q === idx) advance(); }, 300);
}
function setScale(v){
  var q = curQ();
  if (v === 3) {
    delete state.ans[q.id]; delete state.st[q.id]; save();
    var b = $('btnNext'); if (b) b.disabled = true;
    var h = $('qHint'); if (h) h.textContent = 'Elegí un lado para continuar';
  } else {
    state.ans[q.id] = v < 3 ? 'A' : 'B'; state.st[q.id] = Math.abs(v - 3); save();
    enableNext();
  }
  paintScale(v);
}
function advance(){
  clearTimeout(advTimer);
  var nxt = state.q + 1;
  if (nxt >= TOTAL) { finish(); return; }
  var np = QS[nxt].p;
  state.q = nxt;
  if (np !== QS[nxt - 1].p && !state.seen[np]) { state.seen[np] = 1; save(); chapNow = np; show('chap'); return; }
  save(); show('q');
}
function goPrev(){
  clearTimeout(advTimer);
  if (state.q > 0) { state.q--; save(); show('q'); }
  else show('intro');
}
function finish(){
  state.done = true;
  state.minutos = Math.max(1, Math.min(240, Math.round((Date.now() - (state.started || Date.now())) / 60000)));
  save(); sendErr = ''; show('sending'); sendEval();
}
function payload(){
  var r = {}; QS.forEach(function(q){ r[q.id] = state.ans[q.id]; });
  return {sid:state.sid, nombre:state.nombre.trim(), apellido:state.apellido.trim(), email:state.email.trim(), respuestas:r, minutos:state.minutos};
}
async function sendEval(){
  if (sending) return; sending = true;
  try {
    if (APPS_SCRIPT_URL.indexOf('http') !== 0) throw new Error('NO_URL');
    var ctl = new AbortController(), tm = setTimeout(function(){ ctl.abort(); }, 45000);
    var res = await fetch(APPS_SCRIPT_URL, {method:'POST', body:JSON.stringify(payload()), signal:ctl.signal});
    clearTimeout(tm);
    var data = await res.json();
    if (!data || !data.ok) throw new Error((data && data.error) || 'ERR');
    state.sent = true; save(); sendErr = ''; sending = false; show('result'); return;
  } catch (err) {
    console.error(err);
    sendErr = (err && err.message === 'NO_URL') ? 'El envío todavía no está conectado. Avisá a tu coach para completar la configuración.'
      : (err && err.message === 'LIMIT_EMAIL' ? 'Ya se enviaron varias evaluaciones con este email en el día. Probá de nuevo mañana o escribile a tu coach.'
      : 'No hubo conexión con el servidor o tardó demasiado. Revisá tu conexión y volvé a intentar.');
  }
  sending = false;
  if (view === 'sending') show('sending');
}
function resetAll(){
  try { localStorage.removeItem(LS_KEY); } catch(e){}
  state = freshState(); sendErr = ''; sending = false; clearTimeout(advTimer);
  show('intro'); toast('Listo, empezás de cero.');
}

/* ── EVENTOS ───────────────────────────────────────────────── */
document.addEventListener('input', function(e){
  var id = e.target.id;
  if (id === 'fName') { state.nombre = e.target.value; save(); checkStart(); }
  else if (id === 'fLast') { state.apellido = e.target.value; save(); checkStart(); }
  else if (id === 'fMail') { state.email = e.target.value; save(); checkStart(); }
  else if (id === 'qscale') { setScale(parseInt(e.target.value, 10)); }
});
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]'); if (!el) return;
  var a = el.getAttribute('data-action');
  switch (a) {
    case 'start': if (!el.disabled) startEval(); break;
    case 'resume': if (state.sid) show('q'); break;
    case 'fresh': resetAll(); break;
    case 'pick': setPick(el.getAttribute('data-l')); break;
    case 'flip': el.classList.toggle('flipped'); break;
    case 'next': if (!el.disabled) advance(); break;
    case 'prev': goPrev(); break;
    case 'chapGo': show('q'); break;
    case 'retry': sendErr = ''; show('sending'); sendEval(); break;
    case 'restart': $('btnRestart').classList.add('hidden'); $('restartConfirm').classList.remove('hidden'); break;
    case 'restartNo': $('restartConfirm').classList.add('hidden'); $('btnRestart').classList.remove('hidden'); break;
    case 'restartYes': resetAll(); break;
  }
});
document.addEventListener('keydown', function(e){
  if (view !== 'q') return;
  var t = e.target && e.target.tagName;
  if (t === 'INPUT' && e.target.type !== 'range') return;
  var f = fmtOf(state.q), pickF = !(f === 'scale' || f === 'scnScale');
  if (pickF && /^[abAB12]$/.test(e.key)) { e.preventDefault(); setPick(/[aA1]/.test(e.key) ? 'A' : 'B'); }
  else if (e.key === 'ArrowLeft' && t !== 'INPUT') { goPrev(); }
  else if ((e.key === 'ArrowRight' || e.key === 'Enter') && state.ans[curQ().id] && t !== 'BUTTON' && t !== 'INPUT') { advance(); }
});

/* ── ARRANQUE ──────────────────────────────────────────────── */
load();
if (state.sent) show('result');
else if (state.done) { sendErr = ''; show('sending'); sendEval(); }
else show('intro');

</script>
